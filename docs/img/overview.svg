<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="610" rx="14" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="450" y="30" fill="#f1f5f9" font-size="18" font-weight="700" text-anchor="middle">Does V-JEPA 2.1 represent a change in gravity as one consistent direction?</text>
<rect x="20" y="54" width="340" height="82" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="32" y="76" fill="#38bdf8" font-size="13" font-weight="700">1. Same scene, two videos (40 scenes)</text>
<text x="32" y="96" fill="#cbd5e1" font-size="12">A ball launched at Earth gravity (9.8 m/s²)</text>
<text x="32" y="113" fill="#cbd5e1" font-size="12">and at Mars-like gravity (4.9 m/s²).</text>
<text x="32" y="130" fill="#cbd5e1" font-size="12">Start, speed, colour, camera: identical.</text>
<rect x="20" y="152" width="340" height="82" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="32" y="174" fill="#a78bfa" font-size="13" font-weight="700">2. Frozen V-JEPA 2.1 ViT-B/16</text>
<text x="32" y="194" fill="#cbd5e1" font-size="12">Each 5-second video becomes 768 numbers</text>
<text x="32" y="211" fill="#cbd5e1" font-size="12">(mean of the final-layer tokens).</text>
<text x="32" y="228" fill="#cbd5e1" font-size="12">No training, no probe, no labels.</text>
<rect x="20" y="250" width="340" height="82" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="32" y="272" fill="#34d399" font-size="13" font-weight="700">3. Gravity vector g = low-g minus Earth-g</text>
<text x="32" y="292" fill="#cbd5e1" font-size="12">The difference of the two 768-number vectors:</text>
<text x="32" y="309" fill="#cbd5e1" font-size="12">the direction gravity pushes the representation.</text>
<text x="32" y="326" fill="#cbd5e1" font-size="12">One g per scene.</text>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M190 137 V150"/><path d="M190 235 V248"/></g>
<text x="20" y="362" fill="#e2e8f0" font-size="12.5" font-weight="700">Three tests, each with a pass rule</text>
<text x="20" y="384" fill="#fbbf24" font-size="12" font-weight="700">A</text>
<text x="38" y="384" fill="#cbd5e1" font-size="11.5">Mean cosine of g across all 780 scene pairs.</text>
<text x="38" y="399" fill="#cbd5e1" font-size="11.5">Pass if A &gt; 0.</text>
<text x="20" y="426" fill="#fbbf24" font-size="12" font-weight="700">D</text>
<text x="38" y="426" fill="#cbd5e1" font-size="11.5">g matches other scenes' g more than the same</text>
<text x="38" y="441" fill="#cbd5e1" font-size="11.5">scene's own colour change. Pass if D &gt; 0.</text>
<text x="20" y="468" fill="#fbbf24" font-size="12" font-weight="700">R</text>
<text x="38" y="468" fill="#cbd5e1" font-size="11.5">Mean g from 30 scenes predicts the other 10 scenes</text>
<text x="38" y="483" fill="#cbd5e1" font-size="11.5">better than "no change". Pass if R &lt; 1.</text>
<text x="632" y="62" fill="#e2e8f0" font-size="13.5" font-weight="700" text-anchor="middle">Result: trained model vs two controls, same 100 videos</text>
<line x1="410" y1="82" x2="440" y2="82" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/><text x="446" y="86" fill="#cbd5e1" font-size="11">dashed line = pass line</text>
<rect x="600" y="76" width="10" height="10" fill="#34d399"/><text x="615" y="86" fill="#cbd5e1" font-size="11">passes</text>
<rect x="665" y="76" width="10" height="10" fill="#f87171"/><text x="680" y="86" fill="#cbd5e1" font-size="11">fails</text>
<rect x="722" y="76" width="10" height="10" fill="#fbbf24"/><text x="737" y="86" fill="#cbd5e1" font-size="11">noise level</text>
<text x="465.0" y="115" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">A (higher is better)</text>
<rect x="385" y="125" width="160" height="210" fill="#111c33" stroke="#1e293b"/>
<rect x="399" y="159.7" width="36" height="133.3" fill="#34d399"/>
<text x="417" y="154.7" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.635</text>
<text x="417" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="447" y="293.0" width="36" height="1.5" fill="#f87171"/>
<text x="465" y="306.8" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.004</text>
<text x="465" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="465" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="495" y="293.0" width="36" height="3.3" fill="#f87171"/>
<text x="513" y="309.3" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.016</text>
<text x="513" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="513" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<line x1="385" y1="293.0" x2="545" y2="293.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="635.0" y="115" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">D (higher is better)</text>
<rect x="555" y="125" width="160" height="210" fill="#111c33" stroke="#1e293b"/>
<rect x="569" y="167.3" width="36" height="125.7" fill="#34d399"/>
<text x="587" y="162.3" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.598</text>
<text x="587" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="617" y="293.0" width="36" height="12.9" fill="#f87171"/>
<text x="635" y="318.9" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.061</text>
<text x="635" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="635" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="665" y="288.8" width="36" height="4.2" fill="#fbbf24"/>
<text x="683" y="283.8" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.020</text>
<text x="683" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="683" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<line x1="555" y1="293.0" x2="715" y2="293.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="805.0" y="115" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">R (lower is better)</text>
<rect x="725" y="125" width="160" height="210" fill="#111c33" stroke="#1e293b"/>
<rect x="739" y="160.0" width="36" height="69.8" fill="#34d399"/>
<text x="757" y="242.8" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.601</text>
<text x="757" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="787" y="156.9" width="36" height="3.1" fill="#f87171"/>
<text x="805" y="151.9" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">1.018</text>
<text x="805" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="805" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="835" y="157.1" width="36" height="2.9" fill="#f87171"/>
<text x="853" y="152.1" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">1.017</text>
<text x="853" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="853" y="362" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<line x1="725" y1="160.0" x2="885" y2="160.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="632" y="392" fill="#e2e8f0" font-size="11.5" text-anchor="middle">Trained model clears every pass line by a wide margin.</text>
<text x="632" y="411" fill="#e2e8f0" font-size="11.5" text-anchor="middle">Both controls are at noise level or fail on all three tests.</text>
<text x="632" y="430" fill="#cbd5e1" font-size="11.5" text-anchor="middle">R detail: 10 of 10 held-out scenes improved. The learned g and</text>
<text x="632" y="449" fill="#cbd5e1" font-size="11.5" text-anchor="middle">each held-out g point the same way (mean cosine 0.806).</text>
<text x="632" y="468" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Random weights: the identical ViT-B/16, never trained.</text>
<text x="632" y="487" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Pixel stats: per-frame RGB mean and spread, no model.</text>
<text x="632" y="506" fill="#fbbf24" font-size="11.5" text-anchor="middle">Amber: D = 0.020 is formally above 0 but is noise level.</text>
<rect x="20" y="540" width="860" height="52" rx="8" fill="#422006" stroke="#fbbf24"/>
<text x="450" y="560" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">Limits: 40 designed scenes, one renderer, one checkpoint, no significance test.</text>
<text x="450" y="577" fill="#fde68a" font-size="12" text-anchor="middle">Gravity also changes the visible trajectory, so this cannot separate "represents gravity"</text>
<text x="450" y="591" fill="#fde68a" font-size="12" text-anchor="middle">from "represents the resulting trajectory shape".</text>
</svg>