<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="520" rx="14" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="450" y="30" fill="#f1f5f9" font-size="18" font-weight="700" text-anchor="middle">Does V-JEPA 2.1 represent a change in gravity as one consistent direction?</text>
<rect x="20" y="54" width="340" height="82" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="32" y="76" fill="#38bdf8" font-size="13" font-weight="700">1. Same scene, two videos (40 scenes)</text>
<text x="32" y="96" fill="#cbd5e1" font-size="12">A ball launched at Earth gravity (9.8 m/s²)</text>
<text x="32" y="113" fill="#cbd5e1" font-size="12">and at Mars-like gravity (4.9 m/s²).</text>
<text x="32" y="130" fill="#cbd5e1" font-size="12">Start, speed, colour, camera: identical.</text>
<rect x="20" y="152" width="340" height="82" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="32" y="174" fill="#a78bfa" font-size="13" font-weight="700">2. Frozen V-JEPA 2.1 ViT-B/16</text>
<text x="32" y="194" fill="#cbd5e1" font-size="12">Each 5-second video becomes 768 numbers</text>
<text x="32" y="211" fill="#cbd5e1" font-size="12">(mean of the final-layer tokens).</text>
<text x="32" y="228" fill="#cbd5e1" font-size="12">No training, no probe, no labels.</text>
<rect x="20" y="250" width="340" height="82" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="32" y="272" fill="#34d399" font-size="13" font-weight="700">3. Gravity vector g = low-g minus Earth-g</text>
<text x="32" y="292" fill="#cbd5e1" font-size="12">The difference of the two 768-number vectors:</text>
<text x="32" y="309" fill="#cbd5e1" font-size="12">the direction gravity pushes the representation.</text>
<text x="32" y="326" fill="#cbd5e1" font-size="12">One g per scene.</text>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M190 137 V150"/><path d="M190 235 V248"/></g>
<text x="20" y="360" fill="#e2e8f0" font-size="12.5" font-weight="700">Three tests, each with a pass rule</text>
<text x="20" y="380" fill="#fbbf24" font-size="12" font-weight="700">A</text>
<text x="38" y="380" fill="#cbd5e1" font-size="11.5">mean cosine of g between scene pairs (780 pairs)</text>
<text x="38" y="395" fill="#94a3b8" font-size="11">pass if A > 0</text>
<text x="20" y="420" fill="#fbbf24" font-size="12" font-weight="700">D</text>
<text x="38" y="420" fill="#cbd5e1" font-size="11.5">g aligns more with other scenes' g than with the same scene's colour change</text>
<text x="38" y="435" fill="#94a3b8" font-size="11">pass if D > 0</text>
<text x="20" y="460" fill="#fbbf24" font-size="12" font-weight="700">R</text>
<text x="38" y="460" fill="#cbd5e1" font-size="11.5">error of predicting held-out g from 30 training scenes, vs. predicting no change</text>
<text x="38" y="475" fill="#94a3b8" font-size="11">pass if R &lt; 1</text>
<text x="620" y="62" fill="#e2e8f0" font-size="13.5" font-weight="700" text-anchor="middle">Result: trained model vs two controls on the same 100 videos</text>
<text x="465.0" y="98" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">A  (higher is better)</text>
<rect x="385" y="110" width="160" height="220" fill="#111c33" stroke="#1e293b"/>
<line x1="385" y1="286.0" x2="545" y2="286.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="541" y="282.0" fill="#e2e8f0" font-size="10.5" text-anchor="end">pass line 0</text>
<rect x="399" y="146.3" width="36" height="139.7" fill="#34d399"/>
<text x="417" y="141.3" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.635</text>
<text x="417" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="447" y="286.0" width="36" height="1.5" fill="#f87171"/>
<text x="465" y="299.8" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.004</text>
<text x="465" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="465" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="495" y="286.0" width="36" height="3.4" fill="#f87171"/>
<text x="513" y="302.4" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.016</text>
<text x="513" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="513" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<text x="635.0" y="98" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">D  (higher is better)</text>
<rect x="555" y="110" width="160" height="220" fill="#111c33" stroke="#1e293b"/>
<line x1="555" y1="286.0" x2="715" y2="286.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="711" y="282.0" fill="#e2e8f0" font-size="10.5" text-anchor="end">pass line 0</text>
<rect x="569" y="154.4" width="36" height="131.6" fill="#34d399"/>
<text x="587" y="149.4" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.598</text>
<text x="587" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="617" y="286.0" width="36" height="13.5" fill="#f87171"/>
<text x="635" y="312.5" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">-0.061</text>
<text x="635" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="635" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="665" y="281.6" width="36" height="4.4" fill="#fbbf24"/>
<text x="683" y="276.6" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.020</text>
<text x="683" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="683" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<text x="805.0" y="98" fill="#f1f5f9" font-size="12.5" font-weight="700" text-anchor="middle">R  (lower is better)</text>
<rect x="725" y="110" width="160" height="220" fill="#111c33" stroke="#1e293b"/>
<line x1="725" y1="146.7" x2="885" y2="146.7" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="881" y="142.7" fill="#e2e8f0" font-size="10.5" text-anchor="end">pass line 1</text>
<rect x="739" y="146.7" width="36" height="73.2" fill="#34d399"/>
<text x="757" y="232.8" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">0.601</text>
<text x="757" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">trained</text>
<rect x="787" y="143.5" width="36" height="3.2" fill="#f87171"/>
<text x="805" y="138.5" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">1.018</text>
<text x="805" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">random</text>
<text x="805" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">weights</text>
<rect x="835" y="143.6" width="36" height="3.1" fill="#f87171"/>
<text x="853" y="138.6" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">1.017</text>
<text x="853" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">pixel</text>
<text x="853" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">stats</text>
<text x="620" y="372" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Trained model clears every pass line by a wide margin. Both controls are at noise level or fail on all three.</text>
<text x="620" y="392" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Held-out detail for R: 10 of 10 unseen scenes improved; their g points the same way as the learned g (cosine 0.806).</text>
<text x="620" y="412" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Random weights = the identical ViT-B/16 architecture, untrained. Pixel stats = per-frame RGB mean and spread, no model.</text>
<text x="620" y="432" fill="#fbbf24" font-size="11.5" text-anchor="middle">Amber: D = 0.020 is formally above 0 but is noise-level.</text>
<rect x="20" y="470" width="860" height="38" rx="8" fill="#422006" stroke="#fbbf24"/>
<text x="450" y="487" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">Limits: 40 designed scenes, one renderer, one checkpoint, no significance test. Gravity also changes the visible trajectory,</text>
<text x="450" y="502" fill="#fde68a" font-size="12" text-anchor="middle">so this cannot separate "represents gravity" from "represents the resulting trajectory shape".</text>
</svg>